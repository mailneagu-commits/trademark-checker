<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcă din buletin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f6f6f6; color:#0a0d31; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  .head { background:#fff; border-radius:12px; padding:20px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap;
          box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .head img { max-width:200px; max-height:140px; object-fit:contain; border:1px solid #e5e5e5; border-radius:8px; padding:6px; background:#fff; }
  .head .noimg { width:120px; height:90px; display:flex; align-items:center; justify-content:center; font-size:2rem; background:#f6f6f6; border-radius:8px; }
  .name { font-size:1.9rem; font-weight:800; color:#0a0d31; word-break:break-word; }
  .sub  { color:#666; font-size:.9rem; margin-top:4px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; background:#f1f1f3; color:#0a0d31; font-size:.75rem; font-weight:700; margin-right:6px; }
  .card { background:#fff; border-radius:12px; padding:18px 22px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .state { text-align:center; color:#888; padding:60px 20px; }
  .err { color:#c4161c; }
  .links { display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin-bottom:14px; font-size:.95rem; }
  .links a { color:#0a0d31; }
  table.inid { border-collapse:collapse; width:100%; font-size:.86rem; }
  table.inid th { text-align:left; vertical-align:top; padding:6px 14px 6px 0; color:#0a0d31; white-space:nowrap; width:70px; }
  table.inid td { padding:6px 0; border-bottom:1px solid #f6f6f6; line-height:1.5; }
  /* aceleași stiluri ca în cardul din aplicație */
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:14px; }
  .detail-item label { font-size:.69rem; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; }
  .detail-item span  { font-size:.85rem; font-weight:600; color:#0a0d31; }
  .goods-block { margin-bottom:10px; padding:10px 12px; background:#fff; border-radius:7px; border-left:3px solid #0a0d31; }
  .goods-block .cls-title { font-weight:700; color:#0a0d31; font-size:.85rem; margin-bottom:3px; }
  .goods-block .cls-text  { font-size:.82rem; color:#444; line-height:1.55; }
  .goods-block .cls-desc  { font-size:.74rem; color:#999; margin-top:4px; font-style:italic; }

  /* ── Aspect protectmark.ro: antet alb, bleumarin #0a0d31, roșu #e31e24, Inter Tight ── */
  body { font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; }
  h1, h2, h3, th, button, .btn-primary, .btn-export, .btn-sm, .page-tab, .badge, .name, .dtitle { font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  h1, h2, h3 { letter-spacing: -.2px; }
  .card { border-radius: 4px !important; border: 1px solid #e5e5e5; box-shadow: 0 1px 2px rgba(0,0,0,.04) !important; }
  a { color: #e31e24; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">⏳ Se încarcă marca… <span id="t"></span></div></div>
<script src="bulletin-view.js"></script>
<script>
// Titular / reprezentant: numele îngroșat pe primul rând, adresa dedesubt (ca în tabelele de monitorizare).
const _toks = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .split(/[^a-z0-9]+/).filter(Boolean).sort().join(" ");
const _LEGAL = /^(s\.?\s?a\.?|s\.?\s?r\.?\s?l\.?|s\.?\s?l\.?|s\.?\s?p\.?\s?a\.?|ltd\.?|limited|gmbh|ag|bv|b\.v\.|lda\.?|llc|inc\.?|oy|ab|as|a\/s|kft\.?|sas|sarl|eood|ood|s\.?\s?c\.?\s?a\.?)$/i;
function party(text, names) {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  const segs = t.split(/,\s*/), want = (names || []).filter(Boolean).map(_toks);
  let k = 0;
  for (let i = 1; i <= Math.min(4, segs.length) && !k; i++)
    if (want.includes(_toks(segs.slice(0, i).join(" ")))) k = i;
  if (!k && !want.length && segs.length > 1) k = 1;
  if (!k) return want.includes(_toks(t)) ? `<strong>${_bEsc(t)}</strong>` : _bEsc(t);
  while (k < segs.length - 1 && _LEGAL.test(segs[k].trim())) k++;
  const rest = segs.slice(k).join(", ");
  return `<strong>${_bEsc(segs.slice(0, k).join(", "))}</strong>` + (rest ? `<br><span style="color:#555">${_bEsc(rest)}</span>` : "");
}

(async function () {
  const q = new URLSearchParams(location.search);
  const source = q.get("source"), date = q.get("date"), app = q.get("app");
  const root = document.getElementById("root");
  const t0 = Date.now();
  const tick = setInterval(() => {
    const el = document.getElementById("t");
    if (el) el.textContent = "⏱ " + Math.floor((Date.now() - t0) / 1000) + "s";
  }, 1000);
  try {
    const r = await fetch(`/api/monitor/bulletin-mark?source=${encodeURIComponent(source)}&date=${encodeURIComponent(date)}&app_num=${encodeURIComponent(app)}`);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || ("Eroare " + r.status));
    }
    const m = await r.json();
    document.title = (m.tmName || app) + " — marcă din buletin";
    const src = source === "osim" ? "BOPI OSIM" : "Buletin EUIPO";
    const status = m.markCurrentStatusCode || m.tradeMarkStatus || "";
    const img = m.markImageURI
      ? `<img src="${_bEsc(m.markImageURI)}" alt="">`
      : `<div class="noimg">™</div>`;
    const L = m._links || {};
    const lk = (u, label) => u ? `<span>${_bEsc(label)} <a href="${_bEsc(u)}" target="_blank" rel="noopener">${_bEsc(m.applicationNumber)}</a></span>` : "";
    const d = v => { const x = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || ""); return x ? `${x[3]}/${x[2]}/${x[1]}` : (v || ""); };
    const reps = (m.representativeAddress || "") ||
      [...new Set((m.representatives || []).map(r => r.fullName || r.name || "").concat(m.representative ? [m.representative] : []).filter(Boolean))].join("; ");
    const langs = [m.firstLanguage, m.secondLanguage].filter(Boolean).join(" ");
    const goods = {};
    (m.goodAndServices || []).forEach(g => { if (g.goodsAndServices) goods[g.niceClassInt || g.niceClass] = g.goodsAndServices; });
    const inid = [
      ["210", m.applicationNumber], ["220", d(m.applicationDate)], ["270", langs], ["442", d(m.publicationDate || date)],
      ["521", m.acquiredDistinctiveness == null ? "" : (m.acquiredDistinctiveness ? "1" : "0")],
      ["541", m.tmName], ["731", m.applicantAddress || (m.applicantName || []).join("; ")], ["740", reps],
      ["list_511", bulletinClassNumbers(m)],
    ].filter(([, v]) => v !== "" && v != null);
    const names = {
      "731": (m.applicants || []).map(a => a.name).filter(Boolean).concat(m.applicantName || []),
      "740": (m.representatives || []).map(r => r.fullName || r.name).filter(Boolean),
    };
    const inidHtml = `<table class="inid">${inid.map(([k, v]) => `<tr><th>${k}</th><td>${names[k] ? party(v, names[k]) : _bEsc(v)}</td></tr>`).join("")}
      ${Object.keys(goods).length ? Object.entries(goods).map(([c, t]) => `<tr><th>${_bEsc(c)}</th><td>${_bEsc(t)}</td></tr>`).join("") : ""}</table>`;
    root.innerHTML = `
      <div class="links"><a href="#" onclick="if(history.length>1){history.back()}else{window.close()}return false;">Back</a>
        ${lk(L.official, L.official_label || "Oficiu")}${lk(L.tmview, "TMView")}</div>
      <div class="card" style="margin-bottom:16px;">${inidHtml}</div>
      <div class="head">
        ${img}
        <div>
          <div class="name">${_bEsc(m.tmName) || "—"}</div>
          <div class="sub">
            <span class="badge">${src} · ${_bEsc(date)}</span>
            <span class="badge">Nr. ${_bEsc(m.applicationNumber)}</span>
            ${status ? `<span class="badge">${_bEsc(status)}</span>` : ""}
            <span class="badge">Clase: ${_bEsc(bulletinClassNumbers(m))}</span>
          </div>
        </div>
      </div>
      <div class="card">${bulletinMarkDetailHtml(m)}</div>`;
  } catch (e) {
    root.innerHTML = `<div class="state err">❌ ${_bEsc(e.message)}</div>`;
  } finally {
    clearInterval(tick);
  }
})();
</script>
</body>
</html>
