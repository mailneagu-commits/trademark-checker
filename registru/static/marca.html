<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/app.js"></script>
<title>Marcă — ProWatch</title>
</head><body>
<main class="wrap" style="margin-top:24px;">
  <p><a href="javascript:history.length>1?history.back():location.assign('/')">← Înapoi</a></p>
  <div id="root"><div class="card empty-state">Se încarcă…</div></div>
</main>
<script>
header("");
const STATUS_OF = {
  "Cereri de marcă publicate": "Cerere publicată", "Cereri de marcă admise la înregistrare": "Admisă la înregistrare",
  "Mărci înregistrate": "Înregistrată", "Cereri de marcă respinse": "Respinsă",
  "Radiată la cererea titularului": "Radiată", "Cerere retrasă": "Retrasă",
};
const same = (a, b) => String(a || "").toLowerCase().replace(/[^a-z0-9]/g, "") === String(b || "").toLowerCase().replace(/[^a-z0-9]/g, "");
// (450) Apariții BOPI — lista în formatul registrului OSIM: număr BOPI, data, capitolul.
const CAP450 = {
  "Cereri de marcă publicate": "Prima publicare (depozite)",
  "Cereri de marcă admise la înregistrare": "Decizie de admitere la înregistrarea mărcii",
  "Mărci înregistrate": "Mărci înregistrate (publicare Legea 84/1998)",
  "Cereri de marcă respinse": "Decizie de respingere", "Reînnoire": "Reînnoiri",
};
function bopi450(events) {
  const seen = new Set();
  const rows = [...events].filter(e => /^BOPI/.test(e.bopi || "") && e.date)
    .sort((a, b) => a.date.localeCompare(b.date)).map(e => {
      const [y, mo, d] = e.date.split("-");
      const nr = `${+mo}/${y}`;
      const cap = CAP450[e.chapter] || e.chapter || "";
      const line = `Nr. BOPI ${nr} din data ${d}/${mo}/${y}, capitolul ${cap}`;
      if (seen.has(line)) return "";
      seen.add(line);
      return `<li>${esc(line)}</li>`;
    }).join("");
  return rows ? `<section class="card"><h2>Apariții BOPI (450)</h2><ul class="bopi450">${rows}</ul></section>` : "";
}
// Dosarele din Portalul instanțelor (portal.just.ro) legate de marcă — vezi courts.py.
function casesHtml(cases) {
  if (!cases || !cases.length) return "";
  const rows = cases.map(c => {
    const last = (c.sedinte || [])[0];
    const parti = (c.parti || []).map(p => `${esc(p.nume)}${p.calitate ? ` <span class="muted">(${esc(p.calitate)})</span>` : ""}`).join("<br>");
    return `<div class="case">
      <div class="case-h"><strong>Dosar ${esc(c.numar)}</strong> · ${esc(c.instanta)} · ${esc(c.stadiu)}
        ${c.potrivire === "nr" ? '<span class="st bad">marca e menționată în dosar</span>' : '<span class="st pub">după titular — de verificat</span>'}</div>
      <div class="muted small">Obiect: ${esc(c.obiect)} · înregistrat ${dmy(c.data)}</div>
      <div class="small" style="margin-top:6px;">${parti}</div>
      ${last ? `<div class="small" style="margin-top:6px;"><b>${dmy(last.data)}: ${esc(last.solutie)}</b>${last.sumar ? ` — ${esc(last.sumar.slice(0, 400))}${last.sumar.length > 400 ? "…" : ""}` : ""}</div>` : ""}
    </div>`;
  }).join("");
  return `<section class="card"><h2>Litigii · ${cases.length}</h2>
    <p class="muted small" style="margin:-6px 0 12px;">Dosare cu obiect „marcă” de la Tribunalul București și Curtea de Apel București, din Portalul instanțelor de judecată (portal.just.ro), actualizate săptămânal.</p>${rows}</section>`;
}
// Reconstituie, eveniment cu eveniment, ce s-a schimbat față de documentul anterior.
function historyHtml(events) {
  const evs = [...events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  if (!evs.length) return '<p class="muted">—</p>';
  const prev = { status: null, holder: null, classes: null, name: null, expiry: null, rep: undefined };
  const items = evs.map(e => {
    const ch = [];
    const st = STATUS_OF[e.chapter];
    if (st && st !== prev.status) { ch.push(["Stare", prev.status, st]); prev.status = st; }
    if (e.name) {
      const before = e.name_before || prev.name;
      if (!prev.name) ch.push(["Denumire", null, e.name]);
      else if (!same(before, e.name)) ch.push(["Denumire", before, e.name]);
      prev.name = e.name;
    }
    if (e.holder) {
      if (!prev.holder) ch.push(["Titular", null, e.holder]);
      else if (!same(prev.holder, e.holder)) ch.push(["Titular", prev.holder, e.holder]);
      prev.holder = e.holder;
    }
    if (e.classes && e.classes.length) {
      const before = e.classes_before || prev.classes;
      const now = e.classes.join(", ");
      if (!before) ch.push(["Clase Nisa", null, now]);
      else if (before.join(", ") !== now) ch.push(["Clase Nisa", before.join(", "), now]);
      prev.classes = e.classes;
    }
    if ("representative" in e) {
      // Gol la un document = fără reprezentant; la reînnoiri apare doar când lista dă un mandatar.
      const r = e.representative || "";
      if (prev.rep === undefined) { if (r) ch.push(["Reprezentant", null, r]); prev.rep = r; }
      else if (r && !same(prev.rep, r)) { ch.push(["Reprezentant", prev.rep || "fără reprezentant", r]); prev.rep = r; }
    }
    if (e.expiry) { ch.push(["Valabilă până la", prev.expiry ? dmy(prev.expiry) : null, dmy(e.expiry)]); prev.expiry = e.expiry; }
    const rows = ch.map(([k, a, b]) => `<div class="tl-ch"><span class="tl-k">${esc(k)}</span>
        ${a ? `<s class="tl-old">${esc(a)}</s> <span class="tl-arrow">→</span> ` : ""}<b>${esc(b)}</b></div>`).join("");
    const kind = st ? "st" : /Cesiune|Fuziune|titular/i.test(e.chapter) ? "own" : /Reînnoire/.test(e.chapter) ? "ren" :
                 /Limitare|reprezent/i.test(e.chapter) ? "mod" : "oth";
    return `<li class="tl-item tl-${kind}">
      <div class="tl-date">${dmy(e.date) || esc(e.date)}</div>
      <div class="tl-body"><div class="tl-head"><strong>${esc(e.chapter)}</strong> <span class="muted small">· ${esc(e.bopi)}</span></div>
        ${rows}${e.detail && !rows ? `<div class="muted small">${esc(e.detail)}</div>` : ""}
        ${e.detail && rows && /restrânse|șterse|licen|parțial|depozit/i.test(e.detail) ? `<div class="muted small">${esc(e.detail)}</div>` : ""}</div>
    </li>`;
  });
  return `<ol class="tl">${items.join("")}</ol>`;
}
// Axa reprezentanților: toți reprezentanții mărcii de-a lungul timpului, din documentele BOPI
// (gol = fără reprezentant) și din listele de reînnoiri (doar când lista dă un mandatar).
function repAxis(m) {
  const evs = (m.events || []).filter(e => "representative" in e && (e.representative || !/Reînnoire/.test(e.chapter || "")))
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const segs = [];
  for (const e of evs) {
    const last = segs[segs.length - 1];
    if (last && same(last.rep, e.representative || "")) continue;
    segs.push({ rep: e.representative || "", ev: e });
  }
  if (!segs.length) return "";
  const nm = r => r ? r : "fără reprezentant";
  // Același format ca „Istoricul mărcii”: data pe axă, documentul BOPI, schimbarea veche → nouă.
  const items = segs.map((g, i) => {
    const prev = i ? segs[i - 1].rep : null;
    const who = g.rep ? `<a href="/cauta.html?representative=${encodeURIComponent(g.rep)}"><b>${esc(g.rep)}</b></a>` : `<b>${nm("")}</b>`;
    const ch = `<div class="tl-ch"><span class="tl-k">Reprezentant</span>
        ${prev !== null ? `<s class="tl-old">${esc(nm(prev))}</s> <span class="tl-arrow">→</span> ` : ""}${who}</div>`;
    const now = i === segs.length - 1 ? ' <span class="badge light">actual</span>' : "";
    return `<li class="tl-item ${i ? "tl-mod" : "tl-st"}">
      <div class="tl-date">${dmy(g.ev.date) || esc(g.ev.date)}</div>
      <div class="tl-body"><div class="tl-head"><strong>${esc(g.ev.chapter)}</strong> <span class="muted small">· ${esc(g.ev.bopi)}</span>${now}</div>${ch}</div>
    </li>`;
  });
  return `<ol class="tl">${items.join("")}</ol>`;
}

// Mandatar înscris după depunere: primul document al mărcii nu avea reprezentant.
function repLater(m) {
  const evs = (m.events || []).filter(e => "representative" in e).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  if (!evs.length || evs[0].representative) return "";
  const first = evs.find(e => e.representative && same(e.representative, m.representative)) || evs.find(e => e.representative);
  return first ? `<br><span class="muted small">Înscris ulterior — ${esc(first.bopi)} (${dmy(first.date) || esc(first.date)}); la depunere marca nu avea reprezentant.</span>` : "";
}
(async () => {
  const app = decodeURIComponent(location.pathname.split("/").pop() || qs.get("app") || "");
  const root = document.getElementById("root");
  try {
    const m = await api("/api/mark/" + encodeURIComponent(app));
    document.title = `${m.name || m.app} — ${m.app} — ProWatch`;
    const fact = (k, v) => v ? `<div class="fact"><small>${k}</small><b>${v}</b></div>` : "";
    const goods = Object.entries(m.goods || {}).sort((a, b) => +a[0] - +b[0]);
    root.innerHTML = `
      <div class="card mhead">
        <div class="logo-box">${m.image ? `<img src="${esc(m.image)}?hq=1" alt="${esc(m.name)}">` : `<span class="muted" style="font-size:1.4rem;font-weight:800;text-align:center;">${esc(m.name)}</span>`}</div>
        <div>
          <h1>${esc(m.name || (m.placeholder ? m.app : "(marcă figurativă)"))}</h1>
          ${m.placeholder && !m.name ? `<p class="muted small" style="margin:-4px 0 10px;">Marcă reînnoită, înregistrată înainte de 2001 — denumirea nu apare în listele de reînnoiri publicate în BOPI; se completează automat din TMview.</p>` : ""}
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${statusBadge(m.status)}<span class="muted small">${esc(m.mark_type)} · OSIM${m.tm_status ? ` · stare TMview: ${esc(m.tm_status)}${m.tm_status_date ? ` (${dmy(m.tm_status_date)})` : ""}` : ""}</span></div>
          <div class="facts">
            ${fact("Nr. depozit (210)", esc(m.deposit || "necunoscut încă"))}
            ${fact("Data depozit", dmy(m.filing_date))}
            ${fact("Publicată (BOPI)", dmy(m.publication_date))}
            ${fact("Nr. înregistrare (111)", esc(m.reg_display || m.reg_number))}
            ${fact("Înregistrată (BOPI)", dmy(m.reg_date))}
            ${fact("Expiră", dmy(m.expiry_date))}
          </div>
          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn" onclick="openLead('info', ['${esc(m.app)}'])">Solicită informații despre această marcă</button>
            <a class="btn ghost" href="/cauta.html?name=${encodeURIComponent(m.name || "")}&mode=similar">Mărci asemănătoare</a>
          </div>
        </div>
      </div>
      <section class="two">
        <div class="card"><h2>Titular (732)</h2><p style="margin:0;"><a href="/cauta.html?holder=${encodeURIComponent(m.holder)}"><strong>${esc(m.holder)}</strong></a><br><span class="muted small">${esc(m.holder_address)}</span></p></div>
        <div class="card"><h2>Reprezentant (740)</h2>${repAxis(m) || (m.representative ? `<p style="margin:0;"><a href="/cauta.html?representative=${encodeURIComponent(m.representative)}"><strong>${esc(m.representative)}</strong></a>${m.representative_address && m.representative_address !== m.representative ? `<br><span class="muted small">${esc(m.representative_address)}</span>` : ""}${repLater(m)}</p>` : '<p class="muted" style="margin:0;">Fără reprezentant.</p>')}</div>
      </section>
      ${m.vienna || m.colors ? `<section class="card"><div class="facts" style="margin:0;">${fact("Clasificare Viena (531)", esc(m.vienna))}${fact("Culori revendicate (591)", esc(m.colors))}</div></section>` : ""}
      ${m.disclaimer ? `<section class="card"><h2>Mențiuni</h2><p style="margin:0;">${esc(m.disclaimer)}</p></section>` : ""}
      <section class="card goods"><h2>Produse și servicii (511) · ${goods.length} ${goods.length === 1 ? "clasă" : "clase"}</h2>
        ${goods.map(([c, t]) => `<div class="row"><div class="cls">${c}</div><div>${esc(t)}</div></div>`).join("") || '<p class="muted">—</p>'}</section>
      ${casesHtml(m.cases)}
      ${bopi450(m.events || [])}
      <section class="card"><h2>Istoricul mărcii</h2>
        <p class="muted small" style="margin:-6px 0 14px;">Toate aparițiile mărcii în Buletinul Oficial de Proprietate Industrială, în ordine cronologică, cu ce s-a schimbat la fiecare.</p>
        ${historyHtml(m.events || [])}</section>`;
  } catch (e) {
    root.innerHTML = `<div class="card empty-state">${esc(e.message)}</div>`;
  }
})();
</script>
</body></html>
